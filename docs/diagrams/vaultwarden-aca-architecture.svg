<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 830" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Vaultwarden on Azure Container Apps – Architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0078D4"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#505050"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1080" height="830" rx="8" fill="#f9f9f9"/>

  <!-- Title -->
  <text x="540" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">Vaultwarden on Azure Container Apps – Baseline Architecture</text>

  <!-- ==================== External: End User ==================== -->
  <g>
    <!-- Person icon (neutral) -->
    <svg x="82" y="48" width="36" height="36" viewBox="0 0 24 24">
      <circle cx="12" cy="7" r="4" fill="#505050"/>
      <path d="M5,21 C5,16 8,13 12,13 C16,13 19,16 19,21" fill="#505050"/>
    </svg>
    <text x="100" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">End User</text>
  </g>

  <!-- Arrow: End User → Internet -->
  <line x1="124" y1="68" x2="236" y2="68" stroke="#505050" stroke-width="1.4" marker-end="url(#arrow-gray)"/>

  <!-- ==================== External: Internet ==================== -->
  <g>
    <!-- Globe icon (neutral) -->
    <svg x="242" y="48" width="36" height="36" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="none" stroke="#505050" stroke-width="1.5"/>
      <ellipse cx="12" cy="12" rx="5" ry="10" fill="none" stroke="#505050" stroke-width="1"/>
      <line x1="2" y1="9" x2="22" y2="9" stroke="#505050" stroke-width="0.8"/>
      <line x1="2" y1="15" x2="22" y2="15" stroke="#505050" stroke-width="0.8"/>
      <line x1="12" y1="2" x2="12" y2="22" stroke="#505050" stroke-width="0.8"/>
    </svg>
    <text x="260" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Internet</text>
  </g>

  <!-- Arrow: Internet → Container App Ingress (HTTPS 443) -->
  <line x1="260" y1="104" x2="260" y2="233" stroke="#0078D4" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="270" y="170" font-size="11" font-weight="600" fill="#0078D4">HTTPS (443)</text>

  <!-- ==================== Resource Group box ==================== -->
  <rect x="30" y="160" width="1010" height="530" rx="6" fill="none" stroke="#0078D4" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="46" y="180" font-size="12" fill="#0078D4" font-weight="600">Resource Group</text>

  <!-- ==================== Container Apps Environment ==================== -->
  <rect x="60" y="200" width="400" height="160" rx="5" fill="#E8F4FD" stroke="#0078D4" stroke-width="1"/>
  <text x="76" y="222" font-size="12" fill="#0078D4" font-weight="600">Container Apps Environment</text>

  <!-- Container App -->
  <rect x="80" y="235" width="360" height="105" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1.2"/>
  <!-- Azure Container Apps icon -->
  <svg x="86" y="238" width="18" height="18" viewBox="0 0 24 24">
    <path d="M3,5 L12,1 L21,5 L21,19 L12,23 L3,19 Z" fill="#0078D4" opacity="0.15" stroke="#0078D4" stroke-width="1.2"/>
    <path d="M3,5 L12,9 L21,5" fill="none" stroke="#0078D4" stroke-width="1"/>
    <line x1="12" y1="9" x2="12" y2="23" stroke="#0078D4" stroke-width="1"/>
  </svg>
  <text x="260" y="265" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Azure Container App</text>
  <text x="260" y="285" text-anchor="middle" font-size="12" fill="#555">Vaultwarden (Docker image)</text>
  <text x="260" y="305" text-anchor="middle" font-size="11" fill="#777">Ingress · HTTPS · /data mount</text>
  <text x="260" y="325" text-anchor="middle" font-size="11" fill="#777">ENV from Key Vault secret refs</text>

  <!-- ==================== Log Analytics ==================== -->
  <rect x="520" y="200" width="200" height="60" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1"/>
  <!-- Log Analytics icon (bar chart) -->
  <svg x="526" y="205" width="16" height="16" viewBox="0 0 24 24">
    <rect x="3" y="14" width="4" height="7" rx="0.5" fill="#0078D4"/>
    <rect x="10" y="8" width="4" height="13" rx="0.5" fill="#0078D4"/>
    <rect x="17" y="3" width="4" height="18" rx="0.5" fill="#0078D4"/>
    <line x1="1" y1="22" x2="23" y2="22" stroke="#0078D4" stroke-width="1.5"/>
  </svg>
  <text x="620" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Log Analytics</text>
  <text x="620" y="245" text-anchor="middle" font-size="11" fill="#777">Workspace</text>

  <!-- Arrow: CAE → Log Analytics -->
  <line x1="460" y1="230" x2="518" y2="230" stroke="#0078D4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ==================== Azure Files (Storage) ==================== -->
  <rect x="60" y="400" width="200" height="80" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1"/>
  <!-- Azure Storage icon (stacked layers) -->
  <svg x="66" y="403" width="18" height="18" viewBox="0 0 24 24">
    <path d="M2,8 L12,3 L22,8 L22,10 L12,15 L2,10 Z" fill="#0078D4" opacity="0.25" stroke="#0078D4" stroke-width="0.8"/>
    <path d="M2,13 L12,18 L22,13" fill="none" stroke="#0078D4" stroke-width="1"/>
    <path d="M2,17 L12,22 L22,17" fill="none" stroke="#0078D4" stroke-width="1"/>
  </svg>
  <text x="160" y="428" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Azure Files</text>
  <text x="160" y="446" text-anchor="middle" font-size="11" fill="#777">Storage Account</text>
  <text x="160" y="462" text-anchor="middle" font-size="11" fill="#777">File Share → /data</text>

  <!-- Arrow: Container App → Azure Files -->
  <line x1="260" y1="340" x2="260" y2="360" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="260" y1="360" x2="160" y2="360" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="160" y1="360" x2="160" y2="398" stroke="#0078D4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ==================== PostgreSQL ==================== -->
  <rect x="310" y="400" width="220" height="80" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1"/>
  <!-- PostgreSQL icon (database cylinder) -->
  <svg x="316" y="403" width="18" height="18" viewBox="0 0 24 24">
    <ellipse cx="12" cy="6" rx="9" ry="4" fill="#0078D4" opacity="0.2" stroke="#0078D4" stroke-width="1"/>
    <path d="M3,6 L3,18 C3,20.2 7,22 12,22 C17,22 21,20.2 21,18 L21,6" fill="none" stroke="#0078D4" stroke-width="1"/>
    <path d="M3,12 C3,14.2 7,16 12,16 C17,16 21,14.2 21,12" fill="none" stroke="#0078D4" stroke-width="0.8"/>
  </svg>
  <text x="420" y="428" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">PostgreSQL Flexible Server</text>
  <text x="420" y="446" text-anchor="middle" font-size="11" fill="#777">Azure Database for PostgreSQL</text>
  <text x="420" y="462" text-anchor="middle" font-size="11" fill="#777">DATABASE_URL via Key Vault</text>

  <!-- Arrow: Container App → PostgreSQL -->
  <line x1="350" y1="340" x2="350" y2="360" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="350" y1="360" x2="420" y2="360" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="420" y1="360" x2="420" y2="398" stroke="#0078D4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ==================== Key Vault ==================== -->
  <rect x="580" y="400" width="200" height="80" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1"/>
  <!-- Key Vault icon (padlock) -->
  <svg x="586" y="403" width="18" height="18" viewBox="0 0 24 24">
    <rect x="4" y="10" width="16" height="12" rx="2" fill="#F5B400" opacity="0.2" stroke="#F5B400" stroke-width="1.2"/>
    <rect x="8" y="4" width="8" height="8" rx="4" fill="none" stroke="#F5B400" stroke-width="1.5"/>
    <circle cx="12" cy="16" r="2" fill="#F5B400"/>
  </svg>
  <text x="680" y="428" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Azure Key Vault</text>
  <text x="680" y="446" text-anchor="middle" font-size="11" fill="#777">RBAC · Secrets</text>
  <text x="680" y="462" text-anchor="middle" font-size="11" fill="#777">DB URL, SMTP, SSO, Push</text>

  <!-- Arrow: Container App → Key Vault (secret refs) -->
  <line x1="440" y1="285" x2="580" y2="285" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="580" y1="285" x2="680" y2="285" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="680" y1="285" x2="680" y2="398" stroke="#0078D4" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="555" y="278" font-size="10" fill="#0078D4">secret refs</text>

  <!-- ==================== Managed Identities ==================== -->
  <rect x="830" y="200" width="180" height="80" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1"/>
  <!-- Managed Identity icon (person with badge) -->
  <svg x="836" y="203" width="18" height="18" viewBox="0 0 24 24">
    <circle cx="10" cy="7" r="3.5" fill="none" stroke="#0078D4" stroke-width="1.2"/>
    <path d="M3,20 C3,15.5 6,13 10,13 C14,13 17,15.5 17,20" fill="none" stroke="#0078D4" stroke-width="1.2"/>
    <rect x="16" y="11" width="6" height="8" rx="1" fill="#0078D4" opacity="0.2" stroke="#0078D4" stroke-width="1"/>
  </svg>
  <text x="920" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Managed Identities</text>
  <text x="920" y="246" text-anchor="middle" font-size="11" fill="#777">App Identity (Secrets User)</text>
  <text x="920" y="262" text-anchor="middle" font-size="11" fill="#777">KV Writer Identity (Secrets Officer)</text>

  <!-- Arrow: Managed Identity → Key Vault -->
  <line x1="920" y1="280" x2="920" y2="420" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="920" y1="420" x2="782" y2="420" stroke="#0078D4" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="925" y="355" font-size="10" fill="#0078D4" transform="rotate(90, 925, 355)">RBAC</text>

  <!-- ==================== Deployment Script ==================== -->
  <rect x="580" y="515" width="200" height="80" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1"/>
  <!-- Script icon (terminal prompt) -->
  <svg x="586" y="518" width="18" height="18" viewBox="0 0 24 24">
    <rect x="3" y="2" width="18" height="20" rx="2" fill="#0078D4" opacity="0.1" stroke="#0078D4" stroke-width="1.2"/>
    <path d="M7,8 L11,12 L7,16" fill="none" stroke="#0078D4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="13" y1="16" x2="18" y2="16" stroke="#0078D4" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <text x="680" y="543" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Deployment Script</text>
  <text x="680" y="561" text-anchor="middle" font-size="11" fill="#777">Bootstrap: DB user,</text>
  <text x="680" y="577" text-anchor="middle" font-size="11" fill="#777">secrets → Key Vault</text>

  <!-- Arrow: Deployment Script → Key Vault -->
  <line x1="680" y1="515" x2="680" y2="482" stroke="#0078D4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Arrow: Deployment Script → PostgreSQL -->
  <line x1="580" y1="555" x2="480" y2="555" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="480" y1="555" x2="480" y2="482" stroke="#0078D4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ==================== Recovery Services Vault ==================== -->
  <rect x="60" y="515" width="200" height="80" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1"/>
  <!-- Recovery Services icon (shield with check) -->
  <svg x="66" y="518" width="18" height="18" viewBox="0 0 24 24">
    <path d="M12,2 L3,6 L3,12 C3,17 7,21 12,23 C17,21 21,17 21,12 L21,6 Z" fill="#0078D4" opacity="0.15" stroke="#0078D4" stroke-width="1.2"/>
    <path d="M8,12 L11,15 L16,9" fill="none" stroke="#0078D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <text x="160" y="543" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Recovery Services Vault</text>
  <text x="160" y="561" text-anchor="middle" font-size="11" fill="#777">Azure Files Backup</text>
  <text x="160" y="577" text-anchor="middle" font-size="11" fill="#777">Daily + Weekly retention</text>

  <!-- Arrow: Recovery Services → Azure Files -->
  <line x1="160" y1="515" x2="160" y2="482" stroke="#0078D4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ==================== Diagnostic Settings ==================== -->
  <rect x="310" y="515" width="220" height="80" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1"/>
  <!-- Diagnostics icon (gear) -->
  <svg x="316" y="518" width="18" height="18" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4" fill="none" stroke="#0078D4" stroke-width="1.2"/>
    <path d="M12,1 L12,4 M12,20 L12,23 M1,12 L4,12 M20,12 L23,12 M4.2,4.2 L6.3,6.3 M17.7,17.7 L19.8,19.8 M19.8,4.2 L17.7,6.3 M6.3,17.7 L4.2,19.8" stroke="#0078D4" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <text x="420" y="543" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Diagnostic Settings</text>
  <text x="420" y="561" text-anchor="middle" font-size="11" fill="#777">Key Vault → Log Analytics</text>
  <text x="420" y="577" text-anchor="middle" font-size="11" fill="#777">PostgreSQL → Log Analytics</text>

  <!-- Arrow: Diagnostic Settings → Log Analytics -->
  <line x1="420" y1="515" x2="420" y2="505" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="420" y1="505" x2="620" y2="505" stroke="#0078D4" stroke-width="1"/>
  <line x1="620" y1="505" x2="620" y2="262" stroke="#0078D4" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ==================== OPTIONAL: ACS Foundation ==================== -->
  <rect x="60" y="700" width="700" height="110" rx="6" fill="#FFF8E1" stroke="#E6A800" stroke-width="1.2" stroke-dasharray="6 3"/>
  <text x="76" y="722" font-size="12" fill="#E6A800" font-weight="600">Optional – ACS Foundation (acsDeployFoundation = true)</text>

  <rect x="80" y="735" width="190" height="55" rx="4" fill="#fff" stroke="#E6A800" stroke-width="1"/>
  <!-- Email icon -->
  <svg x="86" y="738" width="16" height="16" viewBox="0 0 24 24">
    <rect x="2" y="5" width="20" height="14" rx="2" fill="#E6A800" opacity="0.15" stroke="#E6A800" stroke-width="1.2"/>
    <path d="M2,5 L12,13 L22,5" fill="none" stroke="#E6A800" stroke-width="1.2"/>
  </svg>
  <text x="175" y="760" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Email Service</text>
  <text x="175" y="777" text-anchor="middle" font-size="11" fill="#777">ACS Email Service</text>

  <rect x="290" y="735" width="210" height="55" rx="4" fill="#fff" stroke="#E6A800" stroke-width="1"/>
  <!-- Email domain icon -->
  <svg x="296" y="738" width="16" height="16" viewBox="0 0 24 24">
    <rect x="2" y="5" width="20" height="14" rx="2" fill="#E6A800" opacity="0.15" stroke="#E6A800" stroke-width="1.2"/>
    <text x="12" y="16" text-anchor="middle" font-size="10" fill="#E6A800" font-weight="bold">@</text>
  </svg>
  <text x="395" y="760" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Email Domain Resource</text>
  <text x="395" y="777" text-anchor="middle" font-size="11" fill="#777">Custom domain (DNS verification)</text>

  <rect x="520" y="735" width="220" height="55" rx="4" fill="#fff" stroke="#E6A800" stroke-width="1"/>
  <!-- Communication icon (speech bubble) -->
  <svg x="526" y="738" width="16" height="16" viewBox="0 0 24 24">
    <path d="M3,4 L21,4 Q22,4 22,5 L22,16 Q22,17 21,17 L8,17 L4,21 L4,17 L3,17 Q2,17 2,16 L2,5 Q2,4 3,4 Z" fill="#E6A800" opacity="0.15" stroke="#E6A800" stroke-width="1.2"/>
    <line x1="6" y1="9" x2="18" y2="9" stroke="#E6A800" stroke-width="1"/>
    <line x1="6" y1="13" x2="14" y2="13" stroke="#E6A800" stroke-width="1"/>
  </svg>
  <text x="630" y="760" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Communication Service</text>
  <text x="630" y="777" text-anchor="middle" font-size="11" fill="#777">ACS Communication Service</text>

  <!-- Legend -->
  <rect x="790" y="700" width="240" height="110" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="805" y="722" font-size="12" font-weight="600" fill="#1a1a1a">Legend</text>
  <line x1="805" y1="740" x2="835" y2="740" stroke="#0078D4" stroke-width="1.5"/>
  <text x="842" y="744" font-size="11" fill="#555">Baseline resource / flow</text>
  <line x1="805" y1="760" x2="835" y2="760" stroke="#E6A800" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="842" y="764" font-size="11" fill="#555">Optional component</text>
  <rect x="805" y="775" width="16" height="16" rx="2" fill="#E8F4FD" stroke="#0078D4" stroke-width="0.8"/>
  <text x="828" y="788" font-size="11" fill="#555">Environment boundary</text>
  <line x1="805" y1="800" x2="835" y2="800" stroke="#505050" stroke-width="1.5"/>
  <text x="842" y="804" font-size="11" fill="#555">External access path</text>

</svg>
