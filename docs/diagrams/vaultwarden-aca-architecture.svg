<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 720" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Vaultwarden on Azure Container Apps – Architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0078D4"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1060" height="720" rx="8" fill="#f9f9f9"/>

  <!-- Title -->
  <text x="530" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#1a1a1a">Vaultwarden on Azure Container Apps – Baseline Architecture</text>

  <!-- ==================== Resource Group box ==================== -->
  <rect x="30" y="50" width="1000" height="520" rx="6" fill="none" stroke="#0078D4" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="46" y="70" font-size="12" fill="#0078D4" font-weight="600">Resource Group</text>

  <!-- ==================== Container Apps Environment ==================== -->
  <rect x="60" y="90" width="400" height="160" rx="5" fill="#E8F4FD" stroke="#0078D4" stroke-width="1"/>
  <text x="76" y="112" font-size="12" fill="#0078D4" font-weight="600">Container Apps Environment</text>

  <!-- Container App -->
  <rect x="80" y="125" width="360" height="105" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1.2"/>
  <text x="260" y="155" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Azure Container App</text>
  <text x="260" y="175" text-anchor="middle" font-size="12" fill="#555">Vaultwarden (Docker image)</text>
  <text x="260" y="195" text-anchor="middle" font-size="11" fill="#777">Ingress · HTTPS · /data mount</text>
  <text x="260" y="215" text-anchor="middle" font-size="11" fill="#777">ENV from Key Vault secret refs</text>

  <!-- ==================== Log Analytics ==================== -->
  <rect x="520" y="90" width="200" height="60" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1"/>
  <text x="620" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Log Analytics</text>
  <text x="620" y="135" text-anchor="middle" font-size="11" fill="#777">Workspace</text>

  <!-- Arrow: CAE → Log Analytics -->
  <line x1="460" y1="120" x2="518" y2="120" stroke="#0078D4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ==================== Azure Files (Storage) ==================== -->
  <rect x="60" y="290" width="200" height="80" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1"/>
  <text x="160" y="318" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Azure Files</text>
  <text x="160" y="336" text-anchor="middle" font-size="11" fill="#777">Storage Account</text>
  <text x="160" y="352" text-anchor="middle" font-size="11" fill="#777">File Share → /data</text>

  <!-- Arrow: Container App → Azure Files -->
  <line x1="260" y1="230" x2="260" y2="250" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="260" y1="250" x2="160" y2="250" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="160" y1="250" x2="160" y2="288" stroke="#0078D4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ==================== PostgreSQL ==================== -->
  <rect x="310" y="290" width="220" height="80" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1"/>
  <text x="420" y="318" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">PostgreSQL Flexible Server</text>
  <text x="420" y="336" text-anchor="middle" font-size="11" fill="#777">Azure Database for PostgreSQL</text>
  <text x="420" y="352" text-anchor="middle" font-size="11" fill="#777">DATABASE_URL via Key Vault</text>

  <!-- Arrow: Container App → PostgreSQL -->
  <line x1="350" y1="230" x2="350" y2="250" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="350" y1="250" x2="420" y2="250" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="420" y1="250" x2="420" y2="288" stroke="#0078D4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ==================== Key Vault ==================== -->
  <rect x="580" y="290" width="200" height="80" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1"/>
  <text x="680" y="318" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Azure Key Vault</text>
  <text x="680" y="336" text-anchor="middle" font-size="11" fill="#777">RBAC · Secrets</text>
  <text x="680" y="352" text-anchor="middle" font-size="11" fill="#777">DB URL, SMTP, SSO, Push</text>

  <!-- Arrow: Container App → Key Vault (secret refs) -->
  <line x1="440" y1="175" x2="580" y2="175" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="580" y1="175" x2="680" y2="175" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="680" y1="175" x2="680" y2="288" stroke="#0078D4" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="555" y="168" font-size="10" fill="#0078D4">secret refs</text>

  <!-- ==================== Managed Identities ==================== -->
  <rect x="830" y="90" width="180" height="80" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1"/>
  <text x="920" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Managed Identities</text>
  <text x="920" y="136" text-anchor="middle" font-size="11" fill="#777">App Identity (Secrets User)</text>
  <text x="920" y="152" text-anchor="middle" font-size="11" fill="#777">KV Writer Identity (Secrets Officer)</text>

  <!-- Arrow: Managed Identity → Key Vault -->
  <line x1="920" y1="170" x2="920" y2="310" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="920" y1="310" x2="782" y2="310" stroke="#0078D4" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="925" y="245" font-size="10" fill="#0078D4" transform="rotate(90, 925, 245)">RBAC</text>

  <!-- ==================== Deployment Script ==================== -->
  <rect x="580" y="405" width="200" height="80" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1"/>
  <text x="680" y="433" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Deployment Script</text>
  <text x="680" y="451" text-anchor="middle" font-size="11" fill="#777">Bootstrap: DB user,</text>
  <text x="680" y="467" text-anchor="middle" font-size="11" fill="#777">secrets → Key Vault</text>

  <!-- Arrow: Deployment Script → Key Vault -->
  <line x1="680" y1="405" x2="680" y2="372" stroke="#0078D4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Arrow: Deployment Script → PostgreSQL -->
  <line x1="580" y1="445" x2="480" y2="445" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="480" y1="445" x2="480" y2="372" stroke="#0078D4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ==================== Recovery Services Vault ==================== -->
  <rect x="60" y="405" width="200" height="80" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1"/>
  <text x="160" y="433" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Recovery Services Vault</text>
  <text x="160" y="451" text-anchor="middle" font-size="11" fill="#777">Azure Files Backup</text>
  <text x="160" y="467" text-anchor="middle" font-size="11" fill="#777">Daily + Weekly retention</text>

  <!-- Arrow: Recovery Services → Azure Files -->
  <line x1="160" y1="405" x2="160" y2="372" stroke="#0078D4" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ==================== Diagnostic Settings ==================== -->
  <rect x="310" y="405" width="220" height="80" rx="4" fill="#fff" stroke="#0078D4" stroke-width="1"/>
  <text x="420" y="433" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Diagnostic Settings</text>
  <text x="420" y="451" text-anchor="middle" font-size="11" fill="#777">Key Vault → Log Analytics</text>
  <text x="420" y="467" text-anchor="middle" font-size="11" fill="#777">PostgreSQL → Log Analytics</text>

  <!-- Arrow: Diagnostic Settings → Log Analytics -->
  <line x1="420" y1="405" x2="420" y2="395" stroke="#0078D4" stroke-width="1.2"/>
  <line x1="420" y1="395" x2="620" y2="395" stroke="#0078D4" stroke-width="1"/>
  <line x1="620" y1="395" x2="620" y2="152" stroke="#0078D4" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ==================== OPTIONAL: ACS Foundation ==================== -->
  <rect x="60" y="585" width="700" height="110" rx="6" fill="#FFF8E1" stroke="#E6A800" stroke-width="1.2" stroke-dasharray="6 3"/>
  <text x="76" y="607" font-size="12" fill="#E6A800" font-weight="600">Optional – ACS Foundation (acsDeployFoundation = true)</text>

  <rect x="80" y="620" width="190" height="55" rx="4" fill="#fff" stroke="#E6A800" stroke-width="1"/>
  <text x="175" y="645" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Email Service</text>
  <text x="175" y="662" text-anchor="middle" font-size="11" fill="#777">ACS Email Service</text>

  <rect x="290" y="620" width="210" height="55" rx="4" fill="#fff" stroke="#E6A800" stroke-width="1"/>
  <text x="395" y="645" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Email Domain Resource</text>
  <text x="395" y="662" text-anchor="middle" font-size="11" fill="#777">Custom domain (DNS verification)</text>

  <rect x="520" y="620" width="220" height="55" rx="4" fill="#fff" stroke="#E6A800" stroke-width="1"/>
  <text x="630" y="645" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">Communication Service</text>
  <text x="630" y="662" text-anchor="middle" font-size="11" fill="#777">ACS Communication Service</text>

  <!-- Legend -->
  <rect x="790" y="585" width="230" height="110" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="805" y="607" font-size="12" font-weight="600" fill="#1a1a1a">Legend</text>
  <line x1="805" y1="625" x2="835" y2="625" stroke="#0078D4" stroke-width="1.5"/>
  <text x="842" y="629" font-size="11" fill="#555">Baseline resource / flow</text>
  <line x1="805" y1="647" x2="835" y2="647" stroke="#E6A800" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="842" y="651" font-size="11" fill="#555">Optional component</text>
  <rect x="805" y="660" width="16" height="16" rx="2" fill="#E8F4FD" stroke="#0078D4" stroke-width="0.8"/>
  <text x="828" y="673" font-size="11" fill="#555">Environment boundary</text>

</svg>
