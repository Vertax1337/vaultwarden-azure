name: Finalize PR review fixes

on:
  push:
    branches: [sync/uploaded-developed-repo]
    paths: ['.github/workflows/review-fixes-v2.yml']

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json, re

          ps = Path('scripts/Invoke-CustomerDeployment.ps1')
          s = ps.read_text(encoding='utf-8-sig')

          s, n = re.subn(
              r'(function Get-RuntimeSecretParameters \{.*?\n\s*\$result = @\{\}\s*\n)',
              r'\1    $script:ResolvedCloudflareApiToken = $null\n', s, count=1, flags=re.S)
          assert n == 1, n

          pat = re.compile(r"\n\s*if \(\$Config\.edge\.mode -eq 'cloudflare-managed'\) \{.*?\n\s*\}\s*\n\s*return \$result", re.S)
          repl = r'''
              if ($Config.edge.mode -eq 'cloudflare-managed') {
                  $resolvedCloudflareApiToken = $null
                  if (-not [string]::IsNullOrWhiteSpace($CloudflareApiToken)) {
                      $resolvedCloudflareApiToken = $CloudflareApiToken
                  }
                  elseif ($env:CLOUDFLARE_API_TOKEN) {
                      $resolvedCloudflareApiToken = $env:CLOUDFLARE_API_TOKEN
                  }
                  elseif ($NonInteractive -and -not $GenerateOnly) {
                      throw 'Cloudflare-managed NonInteractive Deployment erfordert -CloudflareApiToken oder CLOUDFLARE_API_TOKEN.'
                  }
                  elseif (-not $GenerateOnly) {
                      $resolvedCloudflareApiToken = Get-CloudflareTokenValue -CloudflareApiToken $CloudflareApiToken
                  }
                  if (-not [string]::IsNullOrWhiteSpace($resolvedCloudflareApiToken)) {
                      $script:ResolvedCloudflareApiToken = $resolvedCloudflareApiToken
                  }
              }
              return $result'''
          s, n = pat.subn(repl, s, count=1)
          assert n == 1, n

          s, n = re.subn(r"\n\s*if \(\$SecureArmParameters\.ContainsKey\('cloudflareApiKey'\)\) \{\s*\n\s*\$params\.parameters\.cloudflareApiKey = @\{ value = \(ConvertFrom-SecureStringPlain -SecureString \$SecureArmParameters\.cloudflareApiKey\) \}\s*\n\s*\}", '', s, count=1)
          assert n == 1, n

          old = "$cfToken = if ($script:ResolvedCloudflareApiToken) { $script:ResolvedCloudflareApiToken } else { Get-CloudflareTokenValue -CloudflareApiToken $CloudflareApiToken }"
          new = """$_resolvedCfVar = Get-Variable -Name ResolvedCloudflareApiToken -Scope Script -ErrorAction SilentlyContinue
          if ($_resolvedCfVar -and -not [string]::IsNullOrWhiteSpace([string]$_resolvedCfVar.Value)) {
              $cfToken = [string]$_resolvedCfVar.Value
          }
          elseif ($NonInteractive) {
              throw 'Cloudflare-managed NonInteractive Deployment hat keinen Cloudflare API Token.'
          }
          else {
              $cfToken = Get-CloudflareTokenValue -CloudflareApiToken $CloudflareApiToken
          }"""
          assert old in s
          ps.write_text(s.replace(old, new, 1), encoding='utf-8')

          bp = Path('main.bicep')
          b = bp.read_text(encoding='utf-8')
          b, n = re.subn(r"@description\('Cloudflare API token\.[^\n]*\n@secure\(\)\nparam cloudflareApiKey string = ''\n\n", '', b, count=1)
          assert n == 1, n
          b = b.replace("var kvSecretCloudflareApiKeyName = 'vw-cloudflare-api-key'\n", '', 1)
          b, n = re.subn(r"\s*\{\n\s*name: 'CLOUDFLARE_API_KEY_SECRET'\n\s*value: kvSecretCloudflareApiKeyName\n\s*\}\n\s*\{\n\s*name: 'CLOUDFLARE_API_KEY_VALUE'\n\s*secureValue: cloudflareApiKey\n\s*\}\n", '\n', b, count=1)
          assert n == 1, n
          start = b.index('# --- Cloudflare API Key ---\\n')
          end = b.index('# --- App DB password', start)
          b = b[:start] + b[end:]
          for forbidden in ('cloudflareApiKey','CLOUDFLARE_API_KEY','kvSecretCloudflareApiKeyName','vw-cloudflare-api-key'):
              assert forbidden not in b, forbidden
          bp.write_text(b, encoding='utf-8')

          def strip_key(x):
              if isinstance(x, dict):
                  x.pop('cloudflareApiKey', None)
                  for v in x.values(): strip_key(v)
              elif isinstance(x, list):
                  for v in x: strip_key(v)
          for name in ('main.deploytoazure.json','current/main.deploytoazure.json'):
              p = Path(name)
              if p.exists():
                  obj = json.loads(p.read_text(encoding='utf-8-sig'))
                  strip_key(obj)
                  p.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          tp = Path('tests/test_repo_contract.py')
          t = tp.read_text(encoding='utf-8')
          old_line = "            if r.get('scope') == \"[format('Microsoft.DBforPostgreSQL/flexibleServers/{0}', variables('postgresServerName'))]\"\n"
          new_lines = "            if 'Microsoft.DBforPostgreSQL/flexibleServers' in str(r.get('scope', ''))\n            and \"variables('postgresServerName')\" in str(r.get('scope', ''))\n"
          assert old_line in t
          tp.write_text(t.replace(old_line, new_lines, 1), encoding='utf-8')
          PY

      - name: Build Bicep
        run: |
          set -euo pipefail
          az bicep install
          az bicep build --file main.bicep --outfile main.json
          ! grep -q 'cloudflareApiKey' main.bicep
          ! grep -q 'CLOUDFLARE_API_KEY' main.bicep
          grep -q 'NonInteractive Deployment erfordert' scripts/Invoke-CustomerDeployment.ps1
          grep -q 'Get-Variable -Name ResolvedCloudflareApiToken' scripts/Invoke-CustomerDeployment.ps1

      - name: Test
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_repo_contract.py

      - name: Commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/review-fixes.yml .github/workflows/review-fixes-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(security): isolate Cloudflare deployment credential'
          git push
