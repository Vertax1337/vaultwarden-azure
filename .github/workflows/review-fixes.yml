name: Apply PR review fixes

on:
  push:
    branches:
      - sync/uploaded-developed-repo
    paths:
      - '.github/workflows/review-fixes.yml'

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch review findings
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json, re

          ps = Path('scripts/Invoke-CustomerDeployment.ps1')
          text = ps.read_text(encoding='utf-8-sig')

          text, n = re.subn(
              r'(function Get-RuntimeSecretParameters \{.*?\n\s*\$result = @\{\}\s*\n)',
              r'\1    $script:ResolvedCloudflareApiToken = $null\n',
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Could not initialize ResolvedCloudflareApiToken: {n}')

          cf_pattern = re.compile(
              r"\n\s*if \(\$Config\.edge\.mode -eq 'cloudflare-managed'\) \{.*?\n\s*\}\s*\n\s*return \$result",
              re.S,
          )
          cf_replacement = r'''
              if ($Config.edge.mode -eq 'cloudflare-managed') {
                  $resolvedCloudflareApiToken = $null
                  if (-not [string]::IsNullOrWhiteSpace($CloudflareApiToken)) {
                      $resolvedCloudflareApiToken = $CloudflareApiToken
                  }
                  elseif ($env:CLOUDFLARE_API_TOKEN) {
                      $resolvedCloudflareApiToken = $env:CLOUDFLARE_API_TOKEN
                  }
                  elseif ($NonInteractive -and -not $GenerateOnly) {
                      throw 'Cloudflare-managed NonInteractive Deployment erfordert -CloudflareApiToken oder CLOUDFLARE_API_TOKEN.'
                  }
                  elseif (-not $GenerateOnly) {
                      $resolvedCloudflareApiToken = Get-CloudflareTokenValue -CloudflareApiToken $CloudflareApiToken
                  }

                  if (-not [string]::IsNullOrWhiteSpace($resolvedCloudflareApiToken)) {
                      # Deployment-only credential: never pass it to ARM or the app-readable Key Vault.
                      $script:ResolvedCloudflareApiToken = $resolvedCloudflareApiToken
                  }
              }
              return $result'''
          text, n = cf_pattern.subn(cf_replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'Could not replace Cloudflare runtime block: {n}')

          text, n = re.subn(
              r"\n\s*if \(\$SecureArmParameters\.ContainsKey\('cloudflareApiKey'\)\) \{\s*\n\s*\$params\.parameters\.cloudflareApiKey = @\{ value = \(ConvertFrom-SecureStringPlain -SecureString \$SecureArmParameters\.cloudflareApiKey\) \}\s*\n\s*\}",
              '',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'Could not remove cloudflareApiKey ARM propagation: {n}')

          old_post = "$cfToken = if ($script:ResolvedCloudflareApiToken) { $script:ResolvedCloudflareApiToken } else { Get-CloudflareTokenValue -CloudflareApiToken $CloudflareApiToken }"
          new_post = """$_resolvedCfVar = Get-Variable -Name ResolvedCloudflareApiToken -Scope Script -ErrorAction SilentlyContinue
          if ($_resolvedCfVar -and -not [string]::IsNullOrWhiteSpace([string]$_resolvedCfVar.Value)) {
              $cfToken = [string]$_resolvedCfVar.Value
          }
          elseif ($NonInteractive) {
              throw 'Cloudflare-managed NonInteractive Deployment hat keinen Cloudflare API Token.'
          }
          else {
              $cfToken = Get-CloudflareTokenValue -CloudflareApiToken $CloudflareApiToken
          }"""
          if old_post not in text:
              raise SystemExit('Cloudflare postdeploy expression not found')
          text = text.replace(old_post, new_post, 1)
          ps.write_text(text, encoding='utf-8')

          bp = Path('main.bicep')
          bt = bp.read_text(encoding='utf-8')
          bt, n = re.subn(
              r"@description\('Cloudflare API token\.[^\n]*\n@secure\(\)\nparam cloudflareApiKey string = ''\n\n",
              '', bt, count=1,
          )
          if n != 1:
              raise SystemExit(f'Could not remove Cloudflare Bicep parameter: {n}')
          bt = bt.replace("var kvSecretCloudflareApiKeyName = 'vw-cloudflare-api-key'\n", '', 1)
          bt, n = re.subn(
              r"\s*\{\n\s*name: 'CLOUDFLARE_API_KEY_SECRET'\n\s*value: kvSecretCloudflareApiKeyName\n\s*\}\n\s*\{\n\s*name: 'CLOUDFLARE_API_KEY_VALUE'\n\s*secureValue: cloudflareApiKey\n\s*\}\n",
              '\n', bt, count=1,
          )
          if n != 1:
              raise SystemExit(f'Could not remove Cloudflare deploymentScript env block: {n}')

          start = bt.find('# --- Cloudflare API Key ---\\n')
          if start < 0:
              raise SystemExit('Cloudflare Key Vault script section start not found')
          next_section = bt.find('# --- App DB password', start)
          if next_section < 0:
              raise SystemExit('Cloudflare Key Vault script section end not found')
          bt = bt[:start] + bt[next_section:]

          forbidden = ('cloudflareApiKey','CLOUDFLARE_API_KEY','kvSecretCloudflareApiKeyName','vw-cloudflare-api-key')
          left = [x for x in forbidden if x in bt]
          if left:
              raise SystemExit(f'Cloudflare ARM/KeyVault references remain: {left}')
          bp.write_text(bt, encoding='utf-8')

          def strip_key(obj):
              if isinstance(obj, dict):
                  obj.pop('cloudflareApiKey', None)
                  for v in obj.values(): strip_key(v)
              elif isinstance(obj, list):
                  for v in obj: strip_key(v)
          for name in ('main.deploytoazure.json','current/main.deploytoazure.json'):
              p = Path(name)
              if p.exists():
                  data = json.loads(p.read_text(encoding='utf-8-sig'))
                  strip_key(data)
                  p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Build and validate Bicep
        shell: bash
        run: |
          set -euo pipefail
          az bicep install
          az bicep build --file main.bicep --outfile main.json
          ! grep -q 'cloudflareApiKey' main.bicep
          ! grep -q 'CLOUDFLARE_API_KEY' main.bicep
          ! grep -q 'vw-cloudflare-api-key' main.bicep
          grep -q 'NonInteractive Deployment erfordert' scripts/Invoke-CustomerDeployment.ps1
          grep -q 'Get-Variable -Name ResolvedCloudflareApiToken' scripts/Invoke-CustomerDeployment.ps1

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_repo_contract.py

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(security): isolate Cloudflare deployment credential'
          git push
