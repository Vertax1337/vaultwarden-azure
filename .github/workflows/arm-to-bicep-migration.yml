name: One-time uploaded repo sync and Bicep regeneration

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/arm-to-bicep-migration.yml'

permissions:
  contents: write

jobs:
  sync-and-regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify uploaded repository payload
        shell: bash
        run: |
          set -euo pipefail
          cat .repo-sync/chunks/*.b64 | tr -d '\n\r' | base64 -d > /tmp/uploaded-repo-delta.tgz
          echo '0206655962ea49e773e34c563a7cd785896cdcb0f3cc45f897efb27879b5074c  /tmp/uploaded-repo-delta.tgz' | sha256sum -c -
          tar -tzf /tmp/uploaded-repo-delta.tgz >/tmp/uploaded-repo-files.txt
          echo "Verified payload contains $(wc -l </tmp/uploaded-repo-files.txt) archive entries."

      - name: Preserve pre-sync repository state
        shell: bash
        run: |
          set -euo pipefail
          backup='deprecated/pre-zip-sync-2026-08-27'
          mkdir -p "$backup"
          for p in main.json main.bicep Readme.md change.md scripts/Invoke-CustomerDeployment.ps1 current customers/vault-50er-jahre-museum-de; do
            if [ -e "$p" ]; then
              cp -a --parents "$p" "$backup"/
            fi
          done

      - name: Apply uploaded developed repository delta
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/uploaded-repo-delta.tgz -C .
          rm -f customers/.gitkeep
          rm -rf tests/__pycache__
          echo 'Uploaded repository delta applied.'

      - name: Verify uploaded ARM source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('main.json')
          b = p.read_bytes()
          git_blob = hashlib.sha1(f'blob {len(b)}\0'.encode() + b).hexdigest()
          expected = '4671f18e4c81281ebb67c676dae303f3135eda56'
          print('main.json git blob:', git_blob)
          if git_blob != expected:
              raise SystemExit(f'Unexpected main.json after sync: {git_blob} != {expected}')
          PY

      - name: Install Bicep CLI
        shell: bash
        run: |
          set -euo pipefail
          az bicep install
          az bicep version

      - name: Regenerate main.bicep from uploaded main.json
        shell: bash
        run: |
          set -uo pipefail
          rm -f main.bicep
          set +e
          az bicep decompile --file main.json --force
          rc=$?
          set -e
          echo "Decompiler exit code: $rc"
          test -f main.bicep

      - name: Repair known ARM decompiler dependency artifacts
        shell: python
        run: |
          from pathlib import Path
          path = Path('main.bicep')
          text = path.read_text(encoding='utf-8')
          replacements = {
              """extensionResourceId(\n      keyVault.id,\n      'Microsoft.Authorization/roleAssignments',\n      guid(keyVault.id, appName_kv_writer_id.id, roleKeyVaultSecretsOfficer)\n    )""": "Microsoft_KeyVault_vaults_keyVaultName_Microsoft_ManagedIdentity_userAssignedIdentities_appName_kv_writer_id_roleKeyVaultSecretsOfficer",
              """extensionResourceId(\n      postgresServer.id,\n      'Microsoft.Authorization/roleAssignments',\n      guid(postgresServer.id, appName_kv_writer_id.id, roleReader)\n    )""": "Microsoft_DBforPostgreSQL_flexibleServers_postgresServerName_Microsoft_ManagedIdentity_userAssignedIdentities_appName_kv_writer_id_roleReader",
              """extensionResourceId(\n      keyVault.id,\n      'Microsoft.Authorization/roleAssignments',\n      guid(keyVault.id, appName_id.id, roleKeyVaultSecretsUser)\n    )""": "Microsoft_KeyVault_vaults_keyVaultName_Microsoft_ManagedIdentity_userAssignedIdentities_appName_id_roleKeyVaultSecretsUser",
          }
          repaired = 0
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  repaired += 1
          path.write_text(text, encoding='utf-8')
          print(f'Repaired {repaired} known decompiler dependency artifact(s).')

      - name: Build regenerated Bicep
        shell: bash
        run: |
          set -euo pipefail
          az bicep build --file main.bicep --outfile /tmp/main.rebuilt.json

      - name: Validate regenerated Bicep against uploaded ARM
        shell: python
        run: |
          import json, sys
          from collections import Counter
          with open('main.json', encoding='utf-8') as f:
              original = json.load(f)
          with open('/tmp/main.rebuilt.json', encoding='utf-8') as f:
              rebuilt = json.load(f)
          failures = []
          def parameter_contract(t):
              return {n: {k:v.get(k) for k in ('type','defaultValue','allowedValues','minValue','maxValue','minLength','maxLength') if k in v} for n,v in t.get('parameters',{}).items()}
          def resource_inventory(t):
              return Counter((r.get('type'), r.get('apiVersion')) for r in t.get('resources',[]))
          def output_contract(t):
              return {n:v.get('type') for n,v in t.get('outputs',{}).items()}
          if original.get('$schema') != rebuilt.get('$schema'): failures.append('$schema differs')
          if original.get('contentVersion') != rebuilt.get('contentVersion'): failures.append('contentVersion differs')
          if parameter_contract(original) != parameter_contract(rebuilt): failures.append('parameter contract differs')
          if resource_inventory(original) != resource_inventory(rebuilt): failures.append('resource type/apiVersion inventory differs')
          if output_contract(original) != output_contract(rebuilt): failures.append('output contract differs')
          print(f"Parameters: {len(original.get('parameters',{}))} -> {len(rebuilt.get('parameters',{}))}")
          print(f"Resources:  {len(original.get('resources',[]))} -> {len(rebuilt.get('resources',[]))}")
          print(f"Outputs:    {len(original.get('outputs',{}))} -> {len(rebuilt.get('outputs',{}))}")
          if failures:
              print('Validation failed:', *failures, sep='\n - ', file=sys.stderr)
              sys.exit(1)
          print('Bicep build succeeded and deployment contract matches uploaded main.json.')

      - name: Finalize repository state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .repo-sync
          rm -f .github/workflows/arm-to-bicep-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No final changes staged.'
            exit 1
          fi
          git commit -m 'chore(repo): sync uploaded developed stand and regenerate Bicep'
          git push
