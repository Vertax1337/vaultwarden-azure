name: One-time ARM to Bicep migration

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/arm-to-bicep-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install/verify Bicep CLI
        shell: bash
        run: |
          set -euo pipefail
          az bicep install
          az bicep version

      - name: Preserve current ARM and legacy Bicep files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deprecated
          cp main.json deprecated/main.pre-bicep-migration.json
          if [ -f main.bicep ]; then
            cp main.bicep deprecated/main.pre-bicep-migration.bicep
          fi

      - name: Decompile current ARM template to Bicep
        shell: bash
        run: |
          set -uo pipefail
          rm -f main.bicep
          set +e
          az bicep decompile --file main.json --force
          rc=$?
          set -e
          echo "Decompiler exit code: $rc"
          test -f main.bicep
          echo '--- role assignment declarations ---'
          grep -n -B 3 -A 14 "Microsoft.Authorization/roleAssignments" main.bicep || true
          echo '--- role identifiers ---'
          grep -n -E "roleKeyVaultSecretsOfficer|roleKeyVaultSecretsUser|roleReader" main.bicep || true

      - name: Stop after role-assignment diagnostics
        shell: bash
        run: |
          echo "Diagnostic run complete. No generated files will be committed in this run."
          exit 1
